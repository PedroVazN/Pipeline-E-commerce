name: CI/CD RotaExpress

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build e teste Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build --build-arg INSTANCE_LABEL=web-srv-01 -t rotaexpress-onepage:${{ github.sha }} .

      - name: Teste — container sobe e responde HTTP 200
        run: |
          docker run -d --name rotaexpress-test -p 8080:80 rotaexpress-onepage:${{ github.sha }}
          sleep 2
          curl -fsS http://localhost:8080/ | grep -q "RotaExpress"
          curl -fsS http://localhost:8080/ | grep -q "web-srv-01"
          docker rm -f rotaexpress-test
